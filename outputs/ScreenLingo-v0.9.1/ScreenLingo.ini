# Язык OCR должен быть установлен в параметрах языка Windows.
SourceLanguage=auto
TargetLanguage=ru

# Сервис перевода: Google, DeepL, LibreTranslate или Yandex Cloud.
TranslationProvider=Google
TranslationEndpoint=https://libretranslate.com
TranslationApiKeyProtected=
YandexApiKeyProtected=
YandexFolderId=

# Через сколько секунд скрывать перевод.
OverlaySeconds=18

# Интервал проверки области в режиме наблюдения, в миллисекундах.
WatchIntervalMs=2000

# Глобальные горячие клавиши.
CaptureHotkey=Ctrl+Shift+T
CopyHotkey=Ctrl+Shift+R
RepeatHotkey=Ctrl+Shift+Y
WatchHotkey=Ctrl+Shift+W
